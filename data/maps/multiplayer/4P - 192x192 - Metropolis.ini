; Terrain, roads, standing buildings, fielded units, damage and credits retained.
; Population/density, production queues, upgrades, cargo, AI state and orders restart.
; Orphaned roads/foundations are assigned to the nearest city quadrant.
; Full writeup: 4P - 192x192 - Metropolis.md

